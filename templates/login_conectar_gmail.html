<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar código</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 5px; font-size: 0.85rem; text-align: center; }
        .alert-danger { background-color: #f8d7da; color: #721c24; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .hint { font-size: 0.85rem; color: #64748b; text-align: center; margin-bottom: 16px; line-height: 1.45; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h2>Receber código no e-mail</h2>
        <p class="hint">O código de 6 dígitos vai para o e-mail informado. Confira também a pasta Spam.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" value="{{ email or '' }}" required placeholder="seu@email.com">
            </div>
            <button class="btn" type="submit">Enviar código</button>
        </form>
        <p class="hint" style="margin-top:16px;"><a href="{{ url_for('login') }}">Voltar</a></p>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
