<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Escolar</title>
    
    <!-- Estilos Embutidos (Garante visual perfeito instantaneamente) -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; }
        
        /* Menu Lateral Escuro */
        .sidebar { height: 100vh; background-color: #2c3e50; color: white; position: fixed; width: 240px; top: 0; left: 0; padding-top: 20px; }
        .sidebar h4 { text-align: center; margin-bottom: 25px; font-size: 1.2rem; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 14px 20px; display: block; font-size: 0.95rem; border-left: 4px solid transparent; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background-color: #34495e; border-left-color: #3498db; }
        
        /* Área de Conteúdo */
        .content { margin-left: 240px; padding: 35px; }
        h2 { margin-bottom: 25px; font-weight: 600; color: #2c3e50; }
        
        /* Grid dos Cards */
        .row { display: flex; gap: 20px; flex-wrap: wrap; }
        .col-md-4 { flex: 1; min-width: 250px; }
        
        /* Cards Coloridos */
        .card { padding: 25px; border-radius: 10px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .card h5 { font-size: 1rem; opacity: 0.9; margin-bottom: 15px; font-weight: 500; }
        .card .display-5 { font-size: 2.8rem; font-weight: bold; }
        
        .bg-primary { background-color: #3498db; }
        .bg-success { background-color: #2ecc71; }
        .bg-warning { background-color: #f39c12; color: white; }
    </style>
</head>
<body>

    <!-- Menu Lateral Padronizado -->
    <div class="sidebar">
        <h4>🏫 Gestão Escolar</h4>
        <a href="{{ url_for('dashboard') }}" class="active">📊 Dashboard</a>
        <a href="{{ url_for('pagina_alunos') }}">👨‍🎓 Gestão de Alunos</a>
        <a href="{{ url_for('pagina_professores') }}">👨‍🏫 Professores</a>
        <a href="{{ url_for('pagina_pedagogico') }}">📚 Pedagógico</a>
        <a href="{{ url_for('pagina_financeiro') }}">💰 Financeiro</a>
        <a href="{{ url_for('pagina_configuracoes') }}">⚙️ Configurações</a>
    </div>

    <!-- Conteúdo do Dashboard -->
    <div class="content">
        <h2>Painel Principal (Dashboard)</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card bg-primary">
                    <h5>Total de Alunos Matriculados</h5>
                    <div class="display-5">{{ metrics.total_alunos }}</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-success">
                    <h5>Professores Ativos</h5>
                    <div class="display-5">{{ metrics.total_professores }}</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-warning">
                    <h5>Turmas Ativas</h5>
                    <div class="display-5">{{ metrics.total_turmas }}</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
